name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-verify-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CATALOG_CONNECTION: "Host=localhost;Port=5432;Database=gatekeeper_catalog;Username=postgres;Password=postgres"
      TENANT_SERVER: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
      TENANT_DB_NAME: tenant_ci_demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Gatekeeper.slnx

      - name: Build
        run: dotnet build Gatekeeper.slnx --no-restore --configuration Release

      # Fast, in-memory unit tests (domain FSM, Telegram Login Widget signature, JSON helpers) —
      # no Postgres needed, unlike everything below this step.
      - name: Unit tests
        run: dotnet test tests/Gatekeeper.Tests --no-build --configuration Release

      # Same tool/version used locally (see docs/changelog.md) so `dotnet ef` behaves identically.
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Create empty databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE gatekeeper_catalog;"
          psql -h localhost -U postgres -c "CREATE DATABASE ${TENANT_DB_NAME};"

      # Applies the real InitialCreate migration against a real Postgres — this is the check that
      # would have caught a broken model/migration before it reached the server.
      - name: Apply Catalog migration
        run: >-
          dotnet ef database update
          --project src/Gatekeeper.Infrastructure
          --startup-project src/Gatekeeper.Infrastructure
          --context CatalogDbContext
          --connection "${CATALOG_CONNECTION}"

      # Seeds one active tenant so the migration runner (below) has something to migrate — mirrors
      # the manual verification in docs/changelog.md.
      - name: Seed an active tenant row
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d gatekeeper_catalog -c
          "INSERT INTO \"Tenants\" (\"Slug\",\"Name\",\"DatabaseName\",\"IsActive\",\"CreatedAt\")
           VALUES ('ci-demo','CI Demo','${TENANT_DB_NAME}', true, now());"

      # Boots the real API against the service Postgres: exercises MigrationRunner exactly as it
      # runs in production, including the cross-tenant migration loop — not just the CLI tooling.
      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5299
          ConnectionStrings__catalog: ${{ env.CATALOG_CONNECTION }}
          Postgres__Server: ${{ env.TENANT_SERVER }}
          Internal__ApiKey: ci-test-key
        run: |
          nohup dotnet src/Gatekeeper.Api/bin/Release/net10.0/Gatekeeper.Api.dll > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5299/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Verify the tenant database was migrated
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d "${TENANT_DB_NAME}" -c "\dt" | grep -q 'Applications' \
            || (echo "Tenant database was not migrated" && exit 1)

      # Exercises POST /internal/tenants/provision end to end: CREATE DATABASE, migrate it, and
      # register the tenant + its two chats in the Catalog.
      - name: Provision a new tenant via the API
        run: |
          response=$(curl -sf -X POST http://localhost:5299/internal/tenants/provision \
            -H "Content-Type: application/json" \
            -H "X-Internal-Key: ci-test-key" \
            -d '{"slug":"ci_provision","name":"CI Provision","mainChatId":-1001,"adminChatId":-2002,"mainChatTitle":null,"adminChatTitle":null}')
          echo "$response"
          echo "$response" | grep -q '"wasCreated":true' \
            || (echo "Expected wasCreated:true on first provision" && exit 1)

      - name: Verify the provisioned tenant database exists
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tenant_ci_provision -c "\dt" | grep -q 'Applications' \
            || (echo "Provisioned tenant database was not migrated" && exit 1)

      - name: Re-provisioning the same slug is idempotent
        run: |
          response=$(curl -sf -X POST http://localhost:5299/internal/tenants/provision \
            -H "Content-Type: application/json" \
            -H "X-Internal-Key: ci-test-key" \
            -d '{"slug":"ci_provision","name":"CI Provision","mainChatId":-1001,"adminChatId":-2002,"mainChatTitle":null,"adminChatTitle":null}')
          echo "$response"
          echo "$response" | grep -q '"wasCreated":false' \
            || (echo "Expected wasCreated:false on re-provision" && exit 1)

      # Boots the real Web app against the already-running API (same service-discovery env var
      # shape docker-compose.yaml uses in prod: services__api__http__0), pointed at the "ci-demo"
      # tenant seeded above (Id 1 — first row in a fresh Catalog DB). This is the check that would
      # have caught the AddServiceDefaults() regression (commit 220b739): without it, service
      # discovery breaks, http://api resolves to the wrong port, and every page after login rendered
      # a blank white screen. Telegram__* values are fake — nothing here logs in for real, only
      # /login (which needs just Telegram:BotUsername, no network call) and static/redirect
      # behavior are exercised.
      - name: Start Web
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5300
          services__api__http__0: http://localhost:5299
          Api__BaseUrl: http://localhost:5299
          Internal__ApiKey: ci-test-key
          Telegram__BotToken: "0:CI-FAKE-TOKEN"
          Telegram__BotUsername: ci_fake_bot
          Telegram__AdminChatId: "-1001"
          Tenant__Id: "1"
        run: |
          nohup dotnet src/Gatekeeper.Web/bin/Release/net10.0/Gatekeeper.Web.dll > web.log 2>&1 &
          echo $! > web.pid

      - name: Wait for Web health check
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5300/health; then
              echo "Web is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Web did not become healthy in time"
          exit 1

      - name: Verify /login renders anonymously
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:5300/login | grep -q '^200$' \
            || (echo "Expected 200 from /login" && exit 1)

      # Regression guard for the exact bug class fixed in commit 55c6d48: missing UseStaticFiles()
      # left the whole wwwroot (including this file) silently 404ing.
      - name: Verify static assets are served
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:5300/app.css | grep -q '^200$' \
            || (echo "Expected 200 from /app.css — static files middleware may be missing" && exit 1)

      - name: Verify unauthenticated requests redirect to /login
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5300/)
          echo "Got $code"
          [ "$code" = "302" ] || (echo "Expected 302 redirect to /login for an anonymous request to /" && exit 1)

      - name: Show Web log
        if: always()
        run: cat web.log || true

      - name: Stop Web
        if: always()
        run: kill "$(cat web.pid)" 2>/dev/null || true

      - name: Show API log
        if: always()
        run: cat api.log || true

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  # Determines which of api/bot/web need rebuilding. A change under a project's own folder always
  # triggers it; a change under a shared dependency (Contracts, ServiceDefaults — or Domain/
  # Application/Infrastructure, which only Api depends on) triggers everything that references it.
  changes:
    needs: build-and-verify-migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.compute.outputs.services }}
      service_names: ${{ steps.compute.outputs.service_names }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/Gatekeeper.Api/**'
              - 'src/Gatekeeper.Domain/**'
              - 'src/Gatekeeper.Application/**'
              - 'src/Gatekeeper.Infrastructure/**'
              - 'src/Gatekeeper.Contracts/**'
              - 'src/Gatekeeper.ServiceDefaults/**'
            bot:
              - 'src/Gatekeeper.Bot/**'
              - 'src/Gatekeeper.Contracts/**'
              - 'src/Gatekeeper.ServiceDefaults/**'
            web:
              - 'src/Gatekeeper.Web/**'
              - 'src/Gatekeeper.Contracts/**'
              - 'src/Gatekeeper.ServiceDefaults/**'

      - id: compute
        run: |
          declare -a entries=()
          declare -a names=()
          if [ "${{ steps.filter.outputs.api }}" = "true" ]; then
            entries+=('{"name":"api","project":"Api"}'); names+=("api")
          fi
          if [ "${{ steps.filter.outputs.bot }}" = "true" ]; then
            entries+=('{"name":"bot","project":"Bot"}'); names+=("bot")
          fi
          if [ "${{ steps.filter.outputs.web }}" = "true" ]; then
            entries+=('{"name":"web","project":"Web"}'); names+=("web")
          fi
          json=$(IFS=,; echo "[${entries[*]}]")
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "service_names=${names[*]}" >> "$GITHUB_OUTPUT"
          echo "Changed services: ${names[*]:-none}"

  # Builds only the services `changes` flagged, straight to GHCR (ubuntu-latest runners are
  # linux/amd64 natively — same arch as the prod server, no cross-compilation needed).
  build-and-push:
    needs: changes
    if: needs.changes.outputs.service_names != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.service.name }}
        run: >-
          dotnet publish src/Gatekeeper.${{ matrix.service.project }}
          -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=alexeydavidenko/gatekeeper-${{ matrix.service.name }}
          -p:ContainerImageTag=latest
          --os linux --arch x64

  # Deploys straight to the home server via the Cloudflare Access-protected SSH tunnel (the box is
  # otherwise only reachable on the local network). Auth is a Service Token scoped to exactly this
  # hostname — separate from the maintainer's own email-OTP login — plus a dedicated SSH key that
  # exists alongside (not instead of) the account's normal password.
  deploy:
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -sL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Open the Access tunnel
        run: |
          cloudflared access ssh --hostname ssh.cerberuslab.dev --url localhost:2222 \
            --service-token-id "${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            --service-token-secret "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" &
          sleep 3

      # Pulls and sanity-checks images one at a time, never in parallel — a past deploy on this
      # exact box corrupted images pulled concurrently (exec format error despite a correct
      # manifest architecture); see docs/changelog.md 2026-07-07. Only recreates the containers
      # that actually changed.
      - name: Deploy changed services
        run: |
          set -euo pipefail
          ssh_cmd() { ssh -p 2222 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 cerberus@localhost "$@"; }

          for svc in ${{ needs.changes.outputs.service_names }}; do
            echo "::group::Pulling gatekeeper-$svc"
            ssh_cmd "docker pull ghcr.io/alexeydavidenko/gatekeeper-$svc:latest"
            echo "::endgroup::"

            echo "::group::Sanity-checking gatekeeper-$svc"
            ssh_cmd "docker run --rm --entrypoint dotnet ghcr.io/alexeydavidenko/gatekeeper-$svc:latest --info" | head -3
            echo "::endgroup::"
          done

          echo "::group::Recreating containers"
          ssh_cmd "docker compose -f ~/gatekeeper-deploy/docker-compose.yaml --project-directory ~/gatekeeper-deploy up -d ${{ needs.changes.outputs.service_names }}"
          echo "::endgroup::"
